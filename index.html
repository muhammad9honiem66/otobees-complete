<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#FFC21A">
<meta name="author" content="Muhammad Ghoniem">
<title>أتوبيس كومبليت</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="firebase-config.js"></script>
<script>
  // الوضع الفاتح/الغامق قبل ما الصفحة تترسم (عشان مفيش وميض)
  try{ const t=localStorage.getItem('ak_theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); document.documentElement.dataset.theme=t; }catch{ document.documentElement.dataset.theme='light'; }
</script>
<style>
/* لوحة الألوان: أصفر أتوبيس المدارس + مرجاني + نعناعي + بنفسجي */
:root{
  --f:'Baloo Bhaijaan 2','Segoe UI','Tahoma',sans-serif;
  --bg:#FFF8EC;--dots:rgba(27,27,47,.07);--surf:#FFFFFF;--surf2:#FFF1D6;--ink:#1B1B2F;--soft:#6B6880;--line:#E9DFCB;
  --yel:#FFC21A;--yelD:#E0A100;--coral:#FF5A6E;--coralD:#D63A50;--mint:#20C3A6;--mintD:#119C84;--sky:#3DB7F2;--grape:#8D6BFF;
  --cur:#FFF0BF;--shadow:0 5px 0 rgba(27,27,47,.12);--onYel:#1B1B2F;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#15142A;--dots:rgba(255,255,255,.06);--surf:#211F3F;--surf2:#2A2850;--ink:#F5F2FF;--soft:#A7A3C9;--line:#3A3769;
  --yel:#FFC93C;--yelD:#C99400;--coral:#FF6B7D;--coralD:#C8475A;--mint:#35D6B8;--mintD:#1E9F86;--sky:#58C4FF;--grape:#A48BFF;
  --cur:#3A3462;--shadow:0 5px 0 rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);background-image:radial-gradient(var(--dots) 1.4px,transparent 1.5px);background-size:18px 18px;overscroll-behavior:none}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.muted{color:var(--soft)}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* أزرار */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 18px;border-radius:18px;font-size:21px;font-weight:800;border:0;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(4px)}
.btn.y{background:var(--yel);color:var(--onYel);box-shadow:0 6px 0 var(--yelD)}
.btn.y:active{box-shadow:0 2px 0 var(--yelD)}
.btn.c{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coralD)}
.btn.c:active{box-shadow:0 2px 0 var(--coralD)}
.btn.o{background:var(--surf);color:var(--ink);border:3px solid var(--ink);box-shadow:var(--shadow)}
.btn.sm{min-height:44px;font-size:17px;border-radius:14px}
.btn:disabled{opacity:.45}
.icon{width:42px;height:42px;flex:none;border-radius:13px;background:var(--surf);border:2px solid var(--line);display:grid;place-items:center;font-size:20px;padding:0;color:var(--ink)}
.pill{background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.card{background:var(--surf);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.sticker{filter:drop-shadow(0 3px 0 rgba(0,0,0,.18)) drop-shadow(0 6px 10px rgba(0,0,0,.12));pointer-events:none}
.emo{position:absolute;font-size:28px;background:#fff;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.18);pointer-events:none}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes wob{50%{transform:rotate(-4deg) scale(1.04)}}
@keyframes float{50%{transform:translateY(-6px) rotate(var(--r,0deg))}}

/* ===== البداية ===== */
#start{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:calc(10px + env(safe-area-inset-top)) max(22px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-right));overflow:hidden}
#start .themeBtn{align-self:flex-start}
.busLogo{width:min(250px,64vw);height:auto;margin-top:6px;transform:rotate(-4deg);animation:pop .5s cubic-bezier(.3,1.5,.6,1) both}
.title{font-size:46px;font-weight:800;line-height:1.05;margin-top:6px}
.title span{color:var(--coral)}
.tags{display:flex;gap:4px;justify-content:center;margin:12px 0 22px;flex-wrap:wrap}
.tags b{font-size:13px;font-weight:700;background:var(--surf);border:2px solid var(--line);border-radius:999px;padding:1px 8px}
.menu{display:flex;flex-direction:column;gap:16px;width:100%;max-width:330px}
.field{display:flex;flex-direction:column;gap:4px;text-align:right;font-size:17px;font-weight:700}
.inp{height:54px;border-radius:16px;border:3px solid var(--line);background:var(--surf);font-size:21px;font-weight:700;padding:0 14px;outline:0;text-align:center}
.inp:focus{border-color:var(--coral)}
.back{background:none;border:0;font-size:17px;color:var(--soft);font-weight:700;align-self:center;margin-top:2px}
.credit{margin-top:auto;padding-top:20px;font-size:14px;color:var(--soft);direction:ltr}
.credit b{color:var(--ink);font-weight:800}
.demo{font-size:15px;line-height:1.5;color:#8a5a00;background:rgba(255,194,26,.25);padding:6px 10px;border-radius:10px;margin-top:14px}
.s1{position:absolute;top:58px;right:22px;width:60px;height:60px;--r:14deg;transform:rotate(14deg);animation:float 3s ease-in-out infinite}
.s2{top:186px;left:22px;transform:rotate(-12deg)}
.s3{top:150px;right:10px;transform:rotate(10deg)}

/* ===== جوه الغرفة ===== */
#room{flex:1;display:flex;flex-direction:column;height:100dvh;min-height:0}
.top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left))}
.top .sp{flex:1}
.bigL{width:52px;height:52px;flex:none;border-radius:16px;background:var(--coral);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800;box-shadow:0 5px 0 var(--coralD)}
.hudT{font-size:17px;font-weight:800;line-height:1.2}
.hudS{font-size:14px;color:var(--soft);font-weight:600}

/* الانتظار */
#lobby{flex:1;overflow:auto;padding:4px max(14px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column}
.ticket{position:relative;margin:4px 2px 0;background:var(--yel);color:#1B1B2F;border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 var(--yelD)}
.ticket:before,.ticket:after{content:"";position:absolute;top:56%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket:before{right:-13px}.ticket:after{left:-13px}
.tk1{display:flex;justify-content:space-between;font-size:15px;font-weight:800}
.code{font-size:44px;font-weight:800;letter-spacing:6px;direction:ltr;text-align:center;line-height:1.15;user-select:all}
.perf{border-top:3px dashed rgba(27,27,47,.35);margin:8px 6px 10px}
.tkb{display:flex;gap:8px}
.tkb .btn{flex:1;min-height:42px;font-size:17px;border-radius:13px;box-shadow:none}
.lh{padding:20px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.lh b{font-size:20px}
.plist{display:flex;flex-direction:column;gap:9px}
.pl{display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:7px 10px;font-size:18px;font-weight:700;animation:pop .3s ease-out both}
.pl .n{margin-inline-start:auto;font-size:14px;color:var(--soft)}
.pl.off{opacity:.45}
.lfoot{margin-top:auto;padding-top:16px}
.wait{text-align:center;font-size:17px;color:var(--soft);font-weight:700;padding:10px}

/* اللعب */
#game{flex:1;display:flex;flex-direction:column;min-height:0}
.tblwrap{flex:1;min-height:0;overflow:auto;margin:0 max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left));background:var(--surf);border:2px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--bg);font-weight:800;font-size:12px;padding:5px 0 3px;line-height:1.15}
th .e{display:block;font-size:15px;line-height:1.2}
td{border-top:1px solid var(--line);border-inline-start:1px solid var(--line);height:30px;text-align:center;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;position:relative}
td:first-child{border-inline-start:0;font-weight:800;font-size:15px}
td sup{position:absolute;left:2px;top:1px;font-size:9.5px;font-weight:800;line-height:1}
.p10{color:var(--mint)}.p5{color:var(--yelD)}.p0{color:var(--coral)}
td.t{font-weight:800;color:var(--grape);font-size:13px}
tr.cur td{background:var(--cur)}
tr.cur td.c{cursor:pointer}
tr.cur td.act{box-shadow:inset 0 0 0 3px var(--coral);border-radius:7px}
tr.cur td:first-child{color:var(--coral)}
.doneRow{display:flex;justify-content:center;padding:0 0 8px}
#doneBtn{min-height:48px;padding:0 30px;font-size:20px;transform:rotate(-2deg)}
#doneBtn.ready{animation:wob 1s ease-in-out infinite}
.dock{background:var(--surf);border-top:2px solid var(--line);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));border-radius:22px 22px 0 0;box-shadow:0 -6px 16px rgba(0,0,0,.08)}
.steps{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.steps i{display:block;height:7px;width:30px;border-radius:9px;background:var(--line);transition:all .2s}
.steps i.d{background:var(--mint)}.steps i.a{background:var(--coral);width:44px}
.inrow{display:flex;align-items:center;gap:8px}
.catT{background:var(--yel);color:#1B1B2F;border-radius:14px;padding:0 12px;height:48px;display:grid;place-items:center;font-size:18px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 var(--yelD);min-width:96px}
#ansIn{flex:1;min-width:0;height:48px;border-radius:14px;border:3px solid var(--coral);background:var(--bg);padding:0 12px;font-size:22px;font-weight:700;outline:0;color:var(--ink)}
#ansIn:disabled{opacity:.6}
.nav{width:48px;height:48px;flex:none;border-radius:14px;background:var(--ink);color:var(--bg);border:0;font-size:24px;font-weight:800;display:grid;place-items:center}
.gameMsg{text-align:center;color:var(--soft);font-weight:700;font-size:16px;padding:6px 10px 14px}

/* ===== النوافذ ===== */
#ov{position:fixed;inset:0;z-index:40;background:rgba(15,12,30,.55);display:flex;align-items:flex-end;justify-content:center}
#ovc{position:relative;width:min(560px,100%);max-height:94dvh;overflow:auto;background:var(--bg);background-image:radial-gradient(var(--dots) 1.4px,transparent 1.5px);background-size:18px 18px;border-radius:28px 28px 0 0;padding:20px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));animation:up .28s cubic-bezier(.2,1.2,.4,1) both}
#ovc.full{height:100dvh;max-height:none;border-radius:0;padding-top:calc(16px + env(safe-area-inset-top))}
#ovc.center{text-align:center}
#ovc.full.center{display:flex;flex-direction:column;justify-content:center;align-items:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.h1{font-size:28px;font-weight:800;line-height:1.2}
.h2{font-size:17px;color:var(--soft);font-weight:600}
.lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:18px 0 10px}
.lb{aspect-ratio:1;min-width:0;border-radius:14px;background:var(--surf);border:2px solid var(--line);font-size:24px;font-weight:800;box-shadow:0 3px 0 var(--line);padding:0;color:var(--ink)}
.lb.used{background:transparent;border-style:dashed;color:var(--soft);opacity:.5;box-shadow:none;text-decoration:line-through}
.lb:not(:disabled):active{background:var(--coral);color:#fff;border-color:var(--coral)}
.lb:disabled{cursor:default}
.huge{font-size:96px;font-weight:800;line-height:1}
.cnt{font-size:64px;font-weight:800;color:var(--coral);line-height:1.1;animation:pop .3s ease-out both}
.burst{width:190px;height:190px;animation:pop .35s cubic-bezier(.3,1.6,.6,1) both}
.scards{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.sc{padding:9px 10px 8px}
.sc.mine{border-color:var(--coral)}
.sch{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;margin-bottom:7px}
.sch .tot{margin-inline-start:auto;background:var(--grape);color:#fff;border-radius:12px;padding:0 10px;font-size:17px}
.sch .av{width:28px;height:28px;font-size:14px}
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.w{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:3px 4px 5px;text-align:center;min-width:0}
.w .k{font-size:11px;color:var(--soft);font-weight:700;line-height:1.2}
.w .v{font-size:15px;font-weight:800;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w .tg{display:flex;justify-content:center;gap:5px;margin-top:3px}
.w .tg button{font-size:13px;font-weight:800;border-radius:9px;padding:0 9px;border:2px solid var(--line);color:var(--soft);background:transparent;line-height:1.5;min-width:34px}
.w .tg button.on10{background:var(--mint);border-color:var(--mint);color:#fff}
.w .tg button.on5{background:var(--yel);border-color:var(--yel);color:#1B1B2F}
.w .tg button:disabled{cursor:default}
.w.dup{border-color:var(--yel)}
.w.bad .v{text-decoration:line-through;color:var(--coral)}
.w .hint{font-size:10px;font-weight:800;color:var(--coral);line-height:1}
.btnrow{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:84px;position:relative;z-index:1}
.pod{width:98px;text-align:center;position:relative}
.pod .bar{border-radius:16px 16px 6px 6px;color:#fff;font-weight:800;font-size:30px;display:grid;place-items:center;animation:grow .6s cubic-bezier(.3,1.3,.5,1) both;transform-origin:bottom}
@keyframes grow{from{transform:scaleY(.1)}}
.pod .nm{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc2{font-size:14px;color:var(--soft);font-weight:700;margin-bottom:4px}
.pod .crown{position:absolute;width:62px;height:52px;top:-64px;left:50%;transform:translateX(-50%) rotate(-8deg)}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.rw{display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:6px 12px;font-size:17px;font-weight:700}
.rw .p{margin-inline-start:auto;font-weight:800}
.dl{font-size:13px;color:var(--mint);font-weight:800}
.conf{position:absolute;z-index:0;width:10px;height:16px;border-radius:3px;animation:fall 1.6s ease-in both;pointer-events:none}
@keyframes fall{from{transform:translateY(-60px) rotate(0);opacity:0}30%{opacity:1}}
.ovTheme{position:absolute;top:calc(12px + env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:3}
.menuBtns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
#cf{position:fixed;inset:0;z-index:70;background:rgba(15,12,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.cfb{width:min(360px,100%);padding:22px 18px;border-radius:22px;background:var(--surf);border:2px solid var(--line);text-align:center;animation:pop .2s ease-out both}
.cfb .h1{font-size:21px;margin-bottom:16px}
.cfb .r{display:flex;gap:10px}.cfb .r .btn{flex:1}
#toast{position:fixed;z-index:80;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:17px;font-weight:700;padding:6px 16px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
@media (max-height:640px){.busLogo{width:180px}.title{font-size:38px}.tags{margin:8px 0 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

      <path d="M14 8h78l20 12-20 12H14z" fill="#3DB7F2" stroke="#1B1B2F" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M92 8l20 12-20 12z" fill="#FFE2B0" stroke="#1B1B2F" stroke-width="3.5" stroke-linejoin="round"/>

<script type="module">
/* =========================================================
   أتوبيس كومبليت — Created by Muhammad Ghoniem
   ========================================================= */
const $ = s => document.querySelector(s);
const LETTERS = 'أ ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي'.split(' ');
const CATS = ['بنت','ولد','حيوان','جماد','نبات','بلاد'];
const EMO  = ['👧','👦','🐱','🪑','🌱','🌍'];
const MAXP = 20;
const COLORS = ['#FF5A6E','#8D6BFF','#20C3A6','#3DB7F2','#FF9F1C','#E85DCF','#5B8DEF','#2BB673'];
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', CODE_RE = /^[A-HJKMNP-Z2-9]{6}$/;
const newCode = () => { const a=crypto.getRandomValues(new Uint32Array(6)); return [...a].map(x=>CODE_ABC[x%CODE_ABC.length]).join(''); };
const ar = n => Number(n||0).toLocaleString('ar-EG');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2,10);

/* ---------- الوضع الفاتح/الغامق ---------- */
const themeIcon = () => document.documentElement.dataset.theme==='dark' ? '☀️' : '🌙';
function toggleTheme(){
  const t = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; try{ localStorage.setItem('ak_theme',t); }catch{}
  document.querySelectorAll('.themeBtn').forEach(b=>b.textContent=themeIcon());
  document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#15142A' : '#FFC21A';
}
document.addEventListener('click',e=>{ if(e.target.closest('.themeBtn')) toggleTheme(); });
document.querySelectorAll('.themeBtn').forEach(b=>b.textContent=themeIcon());
if(document.documentElement.dataset.theme==='dark') document.querySelector('meta[name=theme-color]').content='#15142A';

/* ---------- قاعدة البيانات: Firebase أو وضع تجربة ---------- */
async function makeDB(){
  const cfg = window.FIREBASE_CONFIG;
  if (cfg && cfg.databaseURL){
    try{
      const A = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const D = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
      const U = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
      const app = A.initializeApp(cfg), auth = U.getAuth(app);
      // هوية سرية لكل جهاز (من غير إيميل ولا باسورد) — قواعد قاعدة البيانات بتعتمد عليها
      const user = await new Promise((res,rej)=>{ const off=U.onAuthStateChanged(auth,u=>{ if(u){ off(); res(u); } }); U.signInAnonymously(auth).catch(rej); });
      const db = D.getDatabase(app); const r = p => D.ref(db,p); let off = 0;
      D.onValue(r('.info/serverTimeOffset'), s => off = s.val()||0);
      return { online:true, uid:user.uid,
        on:(p,cb)=>D.onValue(r(p),s=>cb(s.val())), set:(p,v)=>D.set(r(p),v), update:(p,o)=>D.update(r(p),o),
        get:p=>D.get(r(p)).then(s=>s.val()),
        tx:(p,fn)=>D.runTransaction(r(p),fn).then(x=>({committed:x.committed,value:x.snapshot.val()})),
        now:()=>Date.now()+off,
        presence:p=>D.onValue(r('.info/connected'),s=>{ if(s.val()){ D.onDisconnect(r(p)).set(false); D.set(r(p),true);} }) };
    }catch(e){ console.error('Firebase failed',e); }
  }
  return localDB();
}
function localDB(){
  const K='ak_localdb', ls=[];
  const load=()=>{ try{return JSON.parse(localStorage.getItem(K))||{}}catch{return{}} };
  const parts=p=>p.split('/').filter(Boolean), clone=v=>v==null?null:JSON.parse(JSON.stringify(v));
  let tree=load();
  const getAt=p=>parts(p).reduce((o,k)=>o==null?null:(o[k]??null),tree);
  const setAt=(p,v)=>{ const ks=parts(p); let o=tree; for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=='object'||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; } if(v==null) delete o[ks.at(-1)]; else o[ks.at(-1)]=clone(v); };
  const notify=()=>ls.forEach(l=>{ const v=getAt(l.p), j=JSON.stringify(v); if(j!==l.last){ l.last=j; l.cb(clone(v)); } });
  const commit=()=>{ try{ localStorage.setItem(K,JSON.stringify(tree)); }catch{} notify(); };
  addEventListener('storage',e=>{ if(e.key===K){ tree=load(); notify(); } });
  return { online:false,
    on(p,cb){ const l={p,cb}; ls.push(l); setTimeout(notify,0); return ()=>ls.splice(ls.indexOf(l),1); },
    async set(p,v){ tree=load(); setAt(p,v); commit(); },
    async update(p,o){ tree=load(); for(const [k,v] of Object.entries(o)) setAt(p+'/'+k,v); commit(); },
    async get(p){ tree=load(); return clone(getAt(p)); },
    async tx(p,fn){ tree=load(); const nv=fn(clone(getAt(p))); if(nv===undefined) return {committed:false,value:getAt(p)}; setAt(p,nv); commit(); return {committed:true,value:nv}; },
    now:()=>Date.now(),
    presence(p){ this.set(p,true); addEventListener('pagehide',()=>{ tree=load(); setAt(p,false); try{ localStorage.setItem(K,JSON.stringify(tree)); }catch{} }); } };
}
const DB = await makeDB();
const memStore={}; const safe=st=>{ try{ st.setItem('_t','1'); st.removeItem('_t'); return st; }catch{ return memStore; } };
const store = safe(DB.online ? localStorage : sessionStorage);   // وضع التجربة: كل تاب لعّيب
const me = { pid: DB.uid || store.ak_pid || (store.ak_pid = rid()), name: (()=>{ try{ return localStorage.ak_name||''; }catch{ return ''; } })() };

/* ---------- العربي ---------- */
const norm = s => (s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,'').trim();
const keyOf = s => { let t=norm(s); if(t.startsWith('ال') && t.length>3) t=t.slice(2); return t; };
const startsOk = (s,L) => { const l=norm(L); return norm(s).startsWith(l) || keyOf(s).startsWith(l); };

/* ---------- الحالة ---------- */
let code=null, S=null, unsub=null, myAns={}, curN=0, sheetKey='', ovKey='', flushedStop=-1, actCi=0;
const scheduled=new Set();
const R = () => `rooms/${code}`;
const players = () => S?.players || {};
const ordered = () => Object.entries(players()).sort((a,b)=>a[1].j-b[1].j);
const onlinePids = () => ordered().filter(([,v])=>v.on).map(([k])=>k);
const isHost = () => S?.meta?.host === me.pid;
const nameOf = p => players()[p]?.name || '؟';
const colorOf = p => { const i=ordered().findIndex(([k])=>k===p); return COLORS[(i<0?0:i)%COLORS.length]; };
const avatar = (p,cls='') => `<div class="av ${cls}" style="background:${colorOf(p)}">${esc([...nameOf(p)][0]||'؟')}</div>`;
const used = () => S?.used || {};
const lettersLeft = () => LETTERS.filter(l=>!used()[l]).length;
const totals = () => { const t={}; Object.values(S?.res||{}).forEach(r=>Object.entries(r.pts||{}).forEach(([p,v])=>t[p]=(t[p]||0)+(v.t||0))); return t; };

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function ask(t){ return new Promise(res=>{ $('#cfT').textContent=t; $('#cf').hidden=false; const done=v=>{ $('#cf').hidden=true; res(v); }; $('#cfY').onclick=()=>done(true); $('#cfN').onclick=()=>done(false); }); }
function horn(){ try{ const a=new (window.AudioContext||window.webkitAudioContext)(); [[392,0],[311,.22]].forEach(([f,t])=>{ const o=a.createOscillator(),g=a.createGain(); o.type='sawtooth'; o.frequency.value=f; g.gain.setValueAtTime(.0001,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.16,a.currentTime+t+.03); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.32); o.connect(g).connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+.35); }); }catch{} navigator.vibrate?.([120,60,180]); }
const confetti = (n=26) => { let c=''; for(let i=0;i<n;i++){ c+=`<i class="conf" style="top:${190+Math.random()*130}px;left:${(i%2?2:82)+Math.random()*16}%;background:${COLORS[i%COLORS.length]};transform:rotate(${Math.random()*180}deg);animation-delay:${Math.random()*.5}s"></i>`; } return c; };

/* ---------- البداية ---------- */
if (!DB.online) $('#demo').hidden = false;
$('#cName').value = $('#jName').value = me.name;
const urlRoom = new URLSearchParams(location.search).get('r');
function menu(which){
  ['mMain','mCreate','mJoin'].forEach(id=>$('#'+id).hidden=id!==which);
  const f = which==='mCreate' ? $('#cName') : which==='mJoin' ? ($('#jName').value?$('#jCode'):$('#jName')) : null;
  f && setTimeout(()=>f.focus(),50);
}
$('#goCreate').onclick=()=>menu('mCreate');
$('#goJoin').onclick=()=>menu('mJoin');
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>menu('mMain'));
if (urlRoom){ $('#jCode').value=urlRoom; menu('mJoin'); }
const takeName = el => { const n=el.value.trim(); if(!n){ toast('اكتب اسمك الأول'); el.focus(); return null; } me.name=n; try{ localStorage.ak_name=n; }catch{} return n; };

$('#doCreate').onclick = async () => {
  if(!takeName($('#cName'))) return;
  let c; for(let i=0;i<8;i++){ c=newCode(); if(!(await DB.get(`rooms/${c}/meta`))) break; }
  const now=DB.now();
  try{ await DB.set(`rooms/${c}`,{ meta:{host:me.pid,created:now}, players:{[me.pid]:{name:me.name,j:now,on:true}}, phase:'lobby', round:{n:0} }); }
  catch(e){ console.error(e); return toast('في مشكلة في النت، جرّب تاني'); }
  enter(c);
};
$('#cName').onkeydown=e=>{ if(e.key==='Enter') $('#doCreate').click(); };
$('#doJoin').onclick = () => { if(takeName($('#jName'))) join($('#jCode').value.trim()); };
$('#jCode').onkeydown=e=>{ if(e.key==='Enter') $('#doJoin').click(); };
$('#jName').onkeydown=e=>{ if(e.key==='Enter') $('#jCode').focus(); };

async function join(c){
  c = c.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!CODE_RE.test(c)) return toast('رقم الغرفة ٦ حروف وأرقام');
  let room; try{ room = await DB.get(`rooms/${c}`); }catch(e){ console.error(e); return toast('في مشكلة في النت، جرّب تاني'); }
  if(!room?.meta) return toast('مفيش غرفة بالرقم ده');
  const P = room.players||{};
  if(!P[me.pid] && Object.entries(P).filter(([k,v])=>v.on).length >= MAXP) return toast('الغرفة مليانة (٢٠ لعّيب)');
  try{ await DB.update(`rooms/${c}/players/${me.pid}`,{ name:me.name.slice(0,16), j:P[me.pid]?.j||DB.now(), on:true }); }
  catch(e){ console.error(e); return toast('مقدرتش أدخلك الغرفة، جرّب تاني'); }
  enter(c);
}
function enter(c){
  code=c; store.ak_room=c; history.replaceState(null,'','?r='+c);
  DB.presence(`${R()}/players/${me.pid}/on`);
  unsub?.(); unsub = DB.on(R(), onState);
}
function leave(){
  if(code) DB.set(`${R()}/players/${me.pid}/on`,false);
  unsub?.(); unsub=null; code=null; S=null; curN=0; sheetKey=''; delete store.ak_room;
  history.replaceState(null,'',location.pathname);
  $('#room').hidden=true; closeOv(); $('#start').hidden=false; menu('mMain');
}

/* ---------- كل ما الغرفة تتغير ---------- */
function onState(v){
  if(!v?.meta){ if(code){ toast('الغرفة اتقفلت'); leave(); } return; }
  S=v;
  if(!players()[S.meta.host]?.on && onlinePids()[0]===me.pid) DB.set(`${R()}/meta/host`,me.pid);
  const n=S.round?.n||0;
  if(n!==curN){ curN=n; myAns={...(S.ans?.['r'+n]?.[me.pid]||{})}; actCi=0; }
  $('#start').hidden=true; $('#room').hidden=false;
  const lobby=S.phase==='lobby';
  $('#lobby').hidden=!lobby; $('#game').hidden=lobby;
  renderTop();
  if(lobby) renderLobby(); else renderSheet();
  if(S.phase==='stop' && flushedStop!==n){ flushedStop=n; flushAns(); horn(); $('#ansIn').blur(); }
  if(S.phase==='stop' && isHost() && !scheduled.has('s'+n)){ scheduled.add('s'+n); setTimeout(()=>{ if(S.phase==='stop'&&S.round.n===n) DB.set(`${R()}/phase`,'score'); },2600); }
  if(S.phase==='score' && isHost() && allDone() && !scheduled.has('r'+n)){ scheduled.add('r'+n); setTimeout(()=>{ if(S.phase==='score'&&allDone()) showRank(); else scheduled.delete('r'+n); },900); }
  renderOverlay(); tick();
}
function renderTop(){
  const lobby=S.phase==='lobby', n=S.round?.n||0, L=S.round?.letter;
  const key=[lobby,n,L,onlinePids().length,totals()[me.pid]||0,themeIcon()].join('|');
  if(key===renderTop.k) return; renderTop.k=key;
  $('#topBar').innerHTML = lobby
    ? `<button class="icon" id="tExit" aria-label="خروج">→</button><span class="sp"></span><span class="pill">👥 ${ar(onlinePids().length)} / ${ar(MAXP)}</span><button class="icon themeBtn">${themeIcon()}</button>`
    : `<div class="bigL">${L||'؟'}</div><div><div class="hudT">الجولة ${ar(n)}</div><div class="hudS">مجموعك ${ar(totals()[me.pid]||0)} ⭐ • 👥 ${ar(onlinePids().length)}</div></div><span class="sp"></span><button class="icon themeBtn">${themeIcon()}</button><button class="icon" id="tMenu" aria-label="القائمة">⋮</button>`;
  const ex=$('#tExit'); if(ex) ex.onclick=async()=>{ if(await ask('تخرج من الغرفة؟')) leave(); };
  const mn=$('#tMenu'); if(mn) mn.onclick=openMenu;
}

/* ---------- الغرفة (مستنيين) ---------- */
function renderLobby(){
  $('#lCode').textContent=code;
  $('#lCount').textContent=`(${ar(onlinePids().length)}/${ar(MAXP)})`;
  $('#lPlayers').innerHTML=ordered().map(([p,v],i)=>`<div class="pl ${v.on?'':'off'}">${avatar(p)}${esc(v.name)} ${p===S.meta.host?'👑':''}${p===me.pid?' <span class="muted" style="font-size:14px">(انت)</span>':''}<span class="n">${ar(i+1)}</span></div>`).join('');
  $('#lStart').hidden=!isHost(); $('#lWait').hidden=isHost();
  $('#lWait').textContent=`مستنيين ${nameOf(S.meta.host)} يبدأ اللعبة… ⏳`;
}
const shareText=()=>`تعالى نلعب أتوبيس كومبليت 🚌✍️\nرقم الغرفة: ${code}\n${location.origin+location.pathname+'?r='+code}`;
$('#lShare').onclick=async()=>{
  if(navigator.share){ try{ await navigator.share({title:'أتوبيس كومبليت',text:shareText()}); return; }catch(e){ if(e?.name==='AbortError') return; } }
  $('#lCopy').click();
};
$('#lCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(shareText()); toast('اتنسخت الدعوة ✓'); }catch{ toast('رقم الغرفة: '+code); } };
$('#lStart').onclick=()=>newRound();

/* ---------- الجولة ---------- */
async function newRound(){
  if(!isHost()) return;
  if(!lettersLeft()) return DB.set(`${R()}/phase`,'end');
  const n=(S.round?.n||0)+1, on=onlinePids();
  const picker=on[(n-1)%on.length];   // الدور بالترتيب حسب دخول الغرفة
  await DB.update(R(),{phase:'pick', round:{n,picker}});
}
const pickerNow = () => { const p=S.round?.picker; return players()[p]?.on ? p : S.meta.host; };
async function pickLetter(L){
  if(used()[L] || pickerNow()!==me.pid) return;
  const r=await DB.tx(`${R()}/round/letter`,cur=>cur?undefined:L);
  if(!r.committed) return;
  await DB.update(R(),{'round/pickBy':me.pid,'round/writeStart':DB.now()+5200,[`used/${L}`]:true,phase:'write'});
}
async function pressDone(){
  if(S.phase!=='write' || DB.now()<S.round.writeStart) return;
  const empty=CATS.filter((c,i)=>!(myAns['c'+i]||'').trim()).length;
  if(empty && !(await ask(`لسه في ${ar(empty)} خانة فاضية. خلصت برضه؟`))) return;
  flushAns();
  const r=await DB.tx(`${R()}/round/stopBy`,cur=>cur?undefined:me.pid);
  if(r.committed) await DB.update(R(),{'round/stopAt':DB.now(),phase:'stop'});
}
$('#doneBtn').onclick=pressDone;

let saveT={};
function saveCell(ci,v){ myAns['c'+ci]=v; clearTimeout(saveT[ci]); saveT[ci]=setTimeout(()=>DB.set(`${R()}/ans/r${curN}/${me.pid}/c${ci}`,v),350); }
function flushAns(){ Object.values(saveT).forEach(clearTimeout); saveT={}; const o={}; CATS.forEach((c,i)=>o['c'+i]=(myAns['c'+i]||'').trim()); return DB.update(`${R()}/ans/r${curN}/${me.pid}`,o); }

/* ---------- الحساب (٥ و ١٠ بإيدكم) ---------- */
function roundPlayers(n){ const ans=S.ans?.['r'+n]||{}; return ordered().map(([p])=>p).filter(p=>ans[p]||players()[p].on); }
// اقتراح مبدئي: فاضية أو مش بالحرف = ٠، متكررة = ٥، لوحدها = ١٠ … وانتو تعدّلوا براحتكم
function suggest(n){
  const ans=S.ans?.['r'+n]||{}, L=S.round.letter, ps=roundPlayers(n), out={};
  ps.forEach(p=>out[p]={});
  CATS.forEach((c,ci)=>{
    const cnt={};
    ps.forEach(p=>{ const t=(ans[p]?.['c'+ci]||'').trim(); if(t&&startsOk(t,L)){ const k=keyOf(t); cnt[k]=(cnt[k]||0)+1; } });
    ps.forEach(p=>{ const t=(ans[p]?.['c'+ci]||'').trim(); const ok=t&&startsOk(t,L);
      out[p][ci]={t, ok, bad:!!t&&!ok, dup:ok&&cnt[keyOf(t)]>1, v: !ok?0:(cnt[keyOf(t)]>1?5:10)}; });
  });
  return out;
}
function markOf(n,p,ci,sug){ const m=S.marks?.['r'+n]?.[p]?.['c'+ci]; return m==null ? sug[p][ci].v : m; }
function rowTotal(n,p,sug){ return CATS.reduce((s,c,ci)=>s+markOf(n,p,ci,sug),0); }
const allDone = () => { const n=S.round.n, d=S.done?.['r'+n]||{}; return roundPlayers(n).filter(p=>players()[p].on).every(p=>d[p]); };
async function showRank(){
  if(!isHost()||S.phase!=='score') return;
  const n=S.round.n, sug=suggest(n), pts={};
  roundPlayers(n).forEach(p=>{ const o={t:0}; CATS.forEach((c,ci)=>{ o['c'+ci]=markOf(n,p,ci,sug); o.t+=o['c'+ci]; }); pts[p]=o; });
  await DB.update(R(),{[`res/r${n}`]:{letter:S.round.letter,pts},phase:'rank'});
}

/* ---------- الجدول + خانة الكتابة ---------- */
const writing = () => S && S.phase==='write' && DB.now()>=S.round.writeStart;
function renderSheet(){
  const n=S.round?.n||0, ph=S.phase;
  const key=[n,ph,Object.keys(S.res||{}).length,S.round?.letter||'',actCi,CATS.map((c,i)=>myAns['c'+i]||'').join('|'),writing()].join('#');
  if(key===sheetKey) return; sheetKey=key;
  const live=['write','stop'].includes(ph) && S.round?.letter;
  const rows=Math.min(LETTERS.length, Math.max(n+3, 12));
  let h=`<colgroup><col style="width:30px">${CATS.map(()=>'<col>').join('')}<col style="width:34px"></colgroup>`;
  h+=`<thead><tr><th>حرف</th>${CATS.map((c,i)=>`<th><span class="e">${EMO[i]}</span>${c}</th>`).join('')}<th><span class="e">⭐</span>نقط</th></tr></thead><tbody>`;
  for(let r=1;r<=rows;r++){
    const res=S.res?.['r'+r], mine=res?.pts?.[me.pid], a=S.ans?.['r'+r]?.[me.pid]||{};
    const isCur=r===n && live, letter=res?.letter || (r===n?S.round?.letter:'') || '';
    h+=`<tr class="${isCur?'cur':''}"><td>${letter}</td>`;
    CATS.forEach((c,ci)=>{
      const t = isCur ? (myAns['c'+ci]||'') : (a['c'+ci]||'');
      const p = mine ? mine['c'+ci] : null;
      h+=`<td class="${isCur?'c':''} ${isCur&&ci===actCi&&writing()?'act':''}" data-ci="${ci}">${esc(t)}${p!=null?`<sup class="p${p}">${ar(p)}</sup>`:''}</td>`;
    });
    h+=`<td class="t">${mine?ar(mine.t):''}</td></tr>`;
  }
  $('#sheet').innerHTML=h+'</tbody>';
  const cur=$('#sheet tr.cur'); if(cur && writing()) cur.scrollIntoView({block:'nearest'});
  renderWriter();
}
$('#sheet').onclick=e=>{ const td=e.target.closest('tr.cur td.c'); if(!td||!writing()) return; actCi=+td.dataset.ci; sheetKey=''; renderSheet(); $('#ansIn').focus(); };
function renderWriter(){
  const on=writing();
  $('#writer').hidden=!on;
  const ph=S.phase, msg=$('#gameMsg');
  msg.hidden=on || ph!=='write';
  if(!on) msg.textContent='استعدوا… ✏️';
  if(!on) return;
  $('#steps').innerHTML=CATS.map((c,i)=>`<i class="${i===actCi?'a':(myAns['c'+i]||'').trim()?'d':''}"></i>`).join('');
  $('#catT').textContent=EMO[actCi]+' '+CATS[actCi];
  const inp=$('#ansIn'); if(document.activeElement!==inp || inp.dataset.ci!=String(actCi)){ inp.value=myAns['c'+actCi]||''; inp.dataset.ci=actCi; }
  inp.placeholder=`${CATS[actCi]} بحرف الـ${S.round.letter}…`;
  const all=CATS.every((c,i)=>(myAns['c'+i]||'').trim());
  $('#doneBtn').classList.toggle('ready',all);
}
$('#ansIn').oninput=e=>{ saveCell(actCi,e.target.value); sheetKey=''; renderSheet(); };
function nextCell(){
  // روح لأول خانة فاضية بعد الحالية، ولو مفيش روح للي بعدها
  for(let k=1;k<=CATS.length;k++){ const i=(actCi+k)%CATS.length; if(!(myAns['c'+i]||'').trim()){ actCi=i; sheetKey=''; renderSheet(); return; } }
  actCi=(actCi+1)%CATS.length; sheetKey=''; renderSheet();
}
$('#ansIn').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); nextCell(); } };
$('#nextBtn').onpointerdown=e=>e.preventDefault();   // الكيبورد ما يقفلش
$('#nextBtn').onclick=()=>{ nextCell(); $('#ansIn').focus(); };

/* ---------- النوافذ ---------- */
function openOv(key,html,cls=''){
  if(key===ovKey) return;
  const c=$('#ovc'), same=ovKey.split(':')[0]===key.split(':')[0], st=c.scrollTop;
  ovKey=key; c.className=cls; c.innerHTML=(cls.includes('full')?`<button class="icon themeBtn ovTheme">${themeIcon()}</button>`:'')+html; $('#ov').hidden=false;
  if(same) c.scrollTop=st; else { c.style.animation='none'; c.offsetHeight; c.style.animation=''; c.scrollTop=0; }
}
function closeOv(){ ovKey=''; $('#ov').hidden=true; }
function standings(){ const t=totals(); ordered().forEach(([p,v])=>{ if(t[p]==null && v.on) t[p]=0; }); return Object.keys(t).sort((a,b)=>t[b]-t[a]).map(p=>({p,t:t[p]})); }
function podiumHTML(list,deltas){
  const top=list.slice(0,3), order=[top[1],top[0],top[2]], H=[96,132,72], CL=['var(--grape)','var(--coral)','var(--mint)'], PL=[2,1,3];
  const pod=order.map((x,i)=>x?`<div class="pod">${PL[i]===1?'<svg class="sticker crown" viewBox="0 0 100 80"><use href="#crown"/></svg>':''}<div class="nm">${esc(nameOf(x.p))}</div><div class="sc2">${ar(x.t)}${deltas?.[x.p]!=null?` <span class="dl">+${ar(deltas[x.p])}</span>`:''}</div><div class="bar" style="height:${H[i]}px;background:${CL[i]}">${ar(PL[i])}</div></div>`:'').join('');
  const rest=list.slice(3).map((x,i)=>`<div class="rw"><span class="muted">${ar(i+4)}</span>${esc(nameOf(x.p))}${deltas?.[x.p]!=null?`<span class="dl">+${ar(deltas[x.p])}</span>`:''}<span class="p">${ar(x.t)}</span></div>`).join('');
  return `<div class="podium">${pod}</div>${rest?`<div class="rows">${rest}</div>`:''}`;
}
function renderOverlay(){
  if(!S||!code) return closeOv();
  if(ovKey==='menu') return;
  const ph=S.phase, n=S.round?.n||0, rd=S.round||{};

  if(ph==='pick'){
    const mine=pickerNow()===me.pid;
    return openOv(`pick:${n}:${mine}:${pickerNow()}`,`
      <div style="text-align:center"><span class="pill">الجولة ${ar(n)}</span>
      <div class="h1" style="margin-top:10px">${mine?`دورك يا ${esc(me.name)}! 🎯`:`${esc(nameOf(pickerNow()))} بيختار الحرف… 🤔`}</div>
      <div class="h2">${mine?'اختار الحرف… الكل مستنيك':'استنى، أول ما يختار هتبدأ'}</div></div>
      <div class="lgrid">${LETTERS.map(l=>`<button class="lb ${used()[l]?'used':''}" data-l="${l}" ${!mine||used()[l]?'disabled':''}>${l}</button>`).join('')}</div>
      <div class="h2" style="text-align:center;font-size:15px">فاضل ${ar(lettersLeft())} حرف • الحروف المشطوبة اتلعبت</div>`,'full');
  }
  if(ph==='write' && DB.now()<rd.writeStart){
    return openOv(`count:${n}`,`
      <div class="h1">${esc(nameOf(rd.pickBy))} اختار حرف</div>
      <div style="display:flex;justify-content:center;margin:18px 0"><div class="bigL" style="width:130px;height:130px;font-size:90px;border-radius:34px;box-shadow:0 8px 0 var(--coralD);animation:pop .4s cubic-bezier(.3,1.6,.6,1) both">${rd.letter}</div></div>
      <div class="h2">نبدأ بعد…</div><div class="cnt" id="cnt"></div>`,'full center');
  }
  if(ph==='stop'){
    return openOv(`stop:${n}`,`<svg class="sticker burst" viewBox="0 0 120 120"><use href="#burst"/></svg>
      <div class="h1">${esc(nameOf(rd.stopBy))} خلّص 🚌</div><div class="h2">القلم يقف… كله يرفع إيده ✋</div>`,'full center');
  }
  if(ph==='score'){
    const sug=suggest(n), ps=roundPlayers(n), d=S.done?.['r'+n]||{};
    const me1=ps.includes(me.pid)?[me.pid]:[], order=[...me1,...ps.filter(p=>p!==me.pid)];
    let h=`<div style="display:flex;align-items:center;gap:10px"><div class="bigL" style="width:46px;height:46px;font-size:26px">${rd.letter}</div><div class="h1" style="font-size:24px">الإجابات</div>
      </div>
      <div class="h2" style="font-size:15px;margin-top:4px">${esc(nameOf(rd.stopBy))} داس خلصت 🛑 • اختار لنفسك ٥ أو ١٠ ودوس تمام</div><div class="scards">`;
    order.forEach(p=>{ const mine=p===me.pid;
      h+=`<div class="card sc ${mine?'mine':''}"><div class="sch">${avatar(p)}${esc(nameOf(p))}${mine?' (انت)':''}${d[p]?' ✅':''}<span class="tot">${ar(rowTotal(n,p,sug))}</span></div><div class="words">`;
      CATS.forEach((c,ci)=>{ const i=sug[p][ci], v=markOf(n,p,ci,sug);
        h+=`<div class="w ${i.dup?'dup':''} ${i.bad?'bad':''}"><div class="k">${EMO[ci]} ${c}</div><div class="v">${i.t?esc(i.t):'<span class="muted">—</span>'}</div>
          ${i.bad?'<div class="hint">مش بالحرف</div>':i.dup?'<div class="hint" style="color:var(--yelD)">متكررة</div>':''}
          <div class="tg">${[5,10].map(x=>`<button data-ci="${ci}" data-v="${x}" class="${v===x?'on'+x:''}" ${mine&&!d[p]?'':'disabled'}>${ar(x)}</button>`).join('')}</div></div>`; });
      h+=`</div></div>`;
    });
    h+=`</div><div class="btnrow">${ps.includes(me.pid)?`<button class="btn ${d[me.pid]?'o':'y'}" id="okBtn">${d[me.pid]?'↩️ عايز أعدّل':'✅ تمام، حسبت'}</button>`:''}
      ${isHost()?'<button class="btn o sm" id="rankBtn">اعرض الترتيب دلوقتي</button>':''}
      <div class="h2" style="text-align:center;font-size:14px">الترتيب بيظهر أول ما الكل يدوس تمام (${ar(Object.keys(d).filter(k=>d[k]).length)}/${ar(ps.filter(p=>players()[p].on).length)})</div></div>`;
    return openOv(`score:${n}:${JSON.stringify(S.marks?.['r'+n]||{})}:${JSON.stringify(d)}:${JSON.stringify(S.ans?.['r'+n]||{}).length}:${isHost()}`,h,'full');
  }
  if(ph==='rank'){
    const pts=S.res?.['r'+n]?.pts||{}, deltas={}; Object.keys(pts).forEach(p=>deltas[p]=pts[p].t);
    const left=lettersLeft(), on=onlinePids(), nextP=on.length?on[n%on.length]:null;
    return openOv(`rank:${n}:${isHost()}:${left}:${JSON.stringify(totals())}`,`
      ${confetti()}
      <div style="text-align:center"><span class="pill">بعد ${ar(n)} ${n===1?'جولة':'جولات'} • حرف ${rd.letter}</span><div class="h1" style="margin-top:8px">مين الكسبان؟ 🏆</div></div>
      ${podiumHTML(standings(),deltas)}
      <div class="btnrow">
        ${left?`<div class="h2" style="text-align:center;font-size:15px">فاضل ${ar(left)} حرف${nextP?` • الدور على <b style="color:var(--ink)">${esc(nameOf(nextP))}</b>`:''}</div>`:'<div class="h1" style="text-align:center;font-size:20px;color:var(--coral)">الحروف كلها خلصت! 🎉</div>'}
        ${isHost()?(left?'<button class="btn c" id="nextRound">🚌 جولة جديدة</button>':'<button class="btn c" id="endBtn">🏆 النتيجة النهائية</button>'):`<div class="h2" style="text-align:center">⏳ ${esc(nameOf(S.meta.host))} هيبدأ الجولة الجاية</div>`}
        ${left?'<button class="btn o sm" id="endBtn">🏁 إنهاء الجيم والنتيجة النهائية</button>':''}
      </div>`,'full');
  }
  if(ph==='end'){
    const list=standings(), top=list[0];
    return openOv(`end:${isHost()}:${JSON.stringify(list)}`,`
      ${confetti(34)}
      <div style="text-align:center"><span class="pill">${ar(Object.keys(S.res||{}).length)} جولة</span><div class="h1" style="margin-top:8px">النتيجة النهائية 🏆</div>
      ${top&&top.t>0?`<div class="h1" style="color:var(--coral);font-size:24px">🎉 ${esc(nameOf(top.p))} الكسبان!</div>`:''}</div>
      ${podiumHTML(list)}
      <div class="btnrow">${isHost()?'<button class="btn y" id="againBtn">🔁 جيم جديد</button>':''}<button class="btn o sm" id="exitBtn">خروج</button></div>`,'full');
  }
  closeOv();
}
$('#ovc').onclick=async e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.l) return pickLetter(b.dataset.l);
  if(b.dataset.v){ const n=S.round.n, ci=b.dataset.ci, v=+b.dataset.v, cur=markOf(n,me.pid,ci,suggest(n));
    return DB.set(`${R()}/marks/r${n}/${me.pid}/c${ci}`, cur===v?0:v); }
  if(b.id==='okBtn'){ const n=S.round.n, d=S.done?.['r'+n]?.[me.pid]; return DB.set(`${R()}/done/r${n}/${me.pid}`, d?null:true); }
  if(b.id==='rankBtn') return showRank();
  if(b.id==='nextRound') return newRound();
  if(b.id==='endBtn'){ if(lettersLeft() && !(await ask('تنهي الجيم وتعرض النتيجة النهائية؟'))) return; ovKey=''; return DB.set(`${R()}/phase`,'end'); }
  if(b.id==='againBtn') return DB.update(R(),{phase:'lobby',round:{n:0},ans:null,marks:null,done:null,res:null,used:null});
  if(b.id==='exitBtn'){ ovKey=''; return leave(); }
  if(b.id==='mClose'){ ovKey=''; return renderOverlay(); }
};
function openMenu(){
  const inGame=S&&!['lobby','end'].includes(S.phase);
  openOv('menu',`<div class="h1">القائمة</div><div class="h2">غرفة رقم <b style="color:var(--coral);direction:ltr;display:inline-block;letter-spacing:2px">${code}</b></div>
    <div class="menuBtns">
      <button class="btn o sm" id="mCopy">📋 انسخ الدعوة</button>
      ${inGame?'<button class="btn c sm" id="endBtn">🏁 إنهاء الجيم والنتيجة النهائية</button>':''}
      <button class="btn o sm" id="exitBtn">🚪 خروج من الغرفة</button>
      <button class="btn y sm" id="mClose">رجوع للعب</button></div>`);
  $('#mCopy').onclick=()=>$('#lCopy').click();
}
$('#ov').onclick=e=>{ if(e.target.id==='ov' && ovKey==='menu'){ ovKey=''; renderOverlay(); } };

/* ---------- كل ١٠٠ مللي ---------- */
function tick(){
  if(!S||!code) return;
  const ph=S.phase, rd=S.round||{}, left=(rd.writeStart||0)-DB.now();
  if(ph==='write'){
    const c=$('#cnt'); if(c){ const v=left>0?ar(Math.min(5,Math.ceil(left/1000))):''; if(c.textContent!==v){ c.textContent=v; c.style.animation='none'; c.offsetHeight; c.style.animation=''; } }
    if(left<=0 && ovKey.startsWith('count')){ closeOv(); sheetKey=''; renderSheet(); if(!matchMedia('(hover:none)').matches) $('#ansIn').focus(); }
    if(left>0 && !ovKey.startsWith('count') && ovKey!=='menu') renderOverlay();
  }
  if(!!S && writing()!==!$('#writer').hidden){ sheetKey=''; renderSheet(); }
}
setInterval(tick,100);

/* ---------- بداية التشغيل ---------- */
const back=store.ak_room;
if(back && (!urlRoom||urlRoom===back) && me.name){
  const room=await DB.get(`rooms/${back}`);
  if(room?.players?.[me.pid]) join(back); else delete store.ak_room;
}
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
